<div class="player-container">
  <!-- ویدیو -->
  <video #videoEl width="800" height="450"></video>

  <!-- کنترل‌ها -->
  <div class="custom-controls">
    <div class="control-buttons">
      <button (click)="togglePlay()" class="control-btn play-btn">
        <span class="icon">{{ video?.paused ? '▶' : '⏸' }}</span>
      </button>

      <button (click)="skip(-10)" class="control-btn skip-btn">
        <span class="icon">⏪ 10s</span>
      </button>

      <button (click)="skip(10)" class="control-btn skip-btn">
        <span class="icon">10s ⏩</span>
      </button>

      <div class="time-display">
        <span class="current-time">{{ formattedTime }}</span>
        <span class="time-separator"> / </span>
        <span class="total-time">{{ totalFormattedTime }}</span>
      </div>

      <div class="volume-control">
        <span class="icon">{{ video?.muted ? '🔇' : '🔊' }}</span>
        <input
          type="range"
          min="0"
          max="1"
          step="0.1"
          [value]="video?.volume || 0.8"
          (input)="changeVolume($event)"
          class="volume-slider"
        />
        <span class="volume-value">{{ (video?.volume || 0.8) * 100 | number:'1.0-0' }}%</span>
      </div>
    </div>

    <!-- تایم‌لاین -->
    <div class="timeline-container">
      <div
        #timelineBar
        class="timeline-bar"
        (click)="onTimelineClick($event)"
        (mousedown)="onTimelineMouseDown($event)"
      >
        <div class="timeline-progress" [style.width.%]="progressPercent"></div>

        <div class="timeline-thumb" [style.left.%]="progressPercent"></div>
      </div>
    </div>
  </div>
</div>
