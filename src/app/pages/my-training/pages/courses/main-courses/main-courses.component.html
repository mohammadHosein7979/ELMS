<div class="row">
  <div class="col-12">
    <app-filter-courses/>
  </div>
  <div class="col-12 mt-4">
    <div class="bg-white border-radius-20 p-3 p-lg-4">
      <div class="row">
        <div class="col-12 col-lg-3 main-courses-1" id="main-courses-1">
          @for (item of eventListData;track item){
            <div (click)="changeEvent(item)" class="cursorPointer border-radius-10 p-2 item-courses-4 {{itemSelect == item?.id && 'border-color-10'}}  {{item?.type == 1 ? 'item-courses-1' : 'item-courses-3'}} d-flex w-100 justify-content-between pe-4 mb-3" >
              <div class="d-flex align-items-center gap-2">
                <img src="{{item?.avatar}}" class="border-radius-50 item-courses-2">
                <div>
                  <h4 class="font-family-regular font-12 color-1 text-no-wrap line-height-20">
                    {{item?.title}}
                  </h4>
                  <p *ngIf="item?.eventMasters && item?.eventMasters?.length > 0" class="color-9 font-family-regular font-10  text-no-wrap line-height-20">
                    مدرس :
                    {{item?.eventMasters[0]?.person?.name + ' ' + item?.eventMasters[0]?.person?.family}}
                  </p>
                </div>
              </div>
              <div class="text-center">
                <img src="assets/image/my-training/Vector9.svg">
                <h3 class="color-1 font-family-regular font-10">
                  {{item?.eventTypeTitle}}
                </h3>
              </div>

            </div>
          }

        </div>
        <div class="col-12 col-lg-9 main-courses-2" id="main-courses-2">
          <app-detail-courses *ngIf="itemSelect" [itemSelect]="itemSelect"/>
        </div>
      </div>

    </div>
  </div>
</div>
