<div class="row">
  <div class="col-12">
    <app-filter-courses/>
  </div>

  <div class="col-12 mt-4">
    <div class="bg-white border-radius-20 p-3 p-lg-4">
      <div class="row">

        <!-- سایدبار لیست رویدادها -->
        <div class="col-12 col-lg-3 main-courses-1" id="main-courses-1">
          @for (item of filteredEvents; track item.id) {
            <div
              (click)="changeEvent(item)"
              [class]="getEventClass(item)"
              class="cursorPointer border-radius-10 p-2 item-courses-4 d-flex w-100 justify-content-between pe-4 mb-3"
              [class.border-color-10]="isEventSelected(item)"
              [class.item-courses-1]="item.type === 1"
              [class.item-courses-3]="item.type !== 1">

              <div class="d-flex align-items-center gap-2">
                <img [src]="item.avatar" class="border-radius-50 item-courses-2">
                <div>
                  <h4 class="font-family-regular font-12 color-1 text-no-wrap line-height-20">
                    {{item.title}}
                  </h4>
                  <p *ngIf="item.eventMasters && item.eventMasters.length > 0"
                     class="color-9 font-family-regular font-10 text-no-wrap line-height-20">
                    مدرس: {{getMasterName(item)}}
                  </p>
                </div>
              </div>

              <div class="text-center">
                <img src="assets/image/my-training/Vector9.svg">
                <h3 class="color-1 font-family-regular font-10">
                  {{item.eventTypeTitle}}
                </h3>
              </div>
            </div>
          }

          @empty {
            <div class="text-center py-4 color-9">
              موردی یافت نشد
            </div>
          }
        </div>

        <!-- بخش جزئیات -->
        <div class="col-12 col-lg-9 main-courses-2" id="main-courses-2">
          <app-detail-courses *ngIf="selectedEventId" [itemSelect]="selectedEventId"/>

          @if (!selectedEventId && filteredEvents.length === 0) {
            <div class="text-center py-5 color-9">
              هیچ رویدادی برای نمایش وجود ندارد
            </div>
          }
        </div>

      </div>
    </div>
  </div>
</div>
