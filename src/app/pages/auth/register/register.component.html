<div class="login-container">
  <h2>ثبت نام </h2>

  <form (ngSubmit)="submit()" [formGroup]="form" novalidate>
    <div>
      <label>شماره موبایل:</label>
      <input type="text" formControlName="Phone" placeholder="مثلاً 0912..." />
    </div>
    <div>
      <label>نام:</label>
      <input type="text" formControlName="Name" placeholder="مثلاً 0912..." />
    </div>
    <div>
      <label>نام خانوادگی:</label>
      <input type="text" formControlName="Family" placeholder="مثلاً 0912..." />
    </div>
    <div>
      <label>کد ملی:</label>
      <input type="text" formControlName="Ncode" placeholder="مثلاً 0912..." />
    </div>

    <div>
      <label>رمز عبور:</label>
      <input type="password" formControlName="Password" />
    </div>

    <div *ngIf="error" class="error">{{ error }}</div>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'در حال ورود...' : 'ورود' }}
    </button>
  </form>
</div>
