
<div class="container">
  <div class="bg-white p-2 border-radius-20 mb-3">
    <swiper
      (slideChange)="onSlideChange($event)"
      (swiper)="onSwiper($event)"
      [loop]="false"
      [slidesPerView]="'auto'"
      [spaceBetween]="10"
      class="MainOnlineClassesComponent"
    >
      @for (item of dataType; track item) {
        <ng-template swiperSlide>
          <div
            (click)="changeType(item)"
            class="cursorPointer border-radius-10 p-2 {{isActive(item) ? 'main-online-classes-1' : ''}} color-8 font-14 font-family-regular"
          >
            <img src="assets/image/my-educational-system/{{item?.image}}" class="me-2">
            {{item?.title}}
          </div>
        </ng-template>
      }
    </swiper>
  </div>

  <div>
    <!-- اینجا router-outlet اضافه می‌شود -->
    <router-outlet></router-outlet>
  </div>
</div>
