<div class="bg-white border-radius-20 p-12">
  <h3 class="color-1 font-family-bold font-14 mb-3">
    برای پرواز به چه چیزی نیاز داریم ؟
  </h3>
  <div class="row mb-4">
    <div class="col-12 col-lg-6 mb-3 d-flex align-items-center">
      <label class="color-1 font-family-bold font-12 d-flex align-items-center gap-2 cursorPointer">
        <input type="radio" name="q+{{id}}" />
        بال
      </label>
    </div>
    <div class="col-12 col-lg-6 mb-3 d-flex align-items-center">
      <label class="color-1 font-family-bold font-12 d-flex align-items-center gap-2 cursorPointer">
        <input type="radio" name="q+{{id}}" />
        بلیط هواپیما
      </label>
    </div>
    <div class="col-12 col-lg-6 mb-3 d-flex align-items-center">
      <label class="color-1 font-family-bold font-12 d-flex align-items-center gap-2 cursorPointer">
        <input type="radio" name="q+{{id}}" checked/>
        هوایپیما
      </label>
    </div>
    <div class="col-12 col-lg-6 mb-3 d-flex align-items-center">
      <label class="color-1 font-family-bold font-12 d-flex align-items-center gap-2 cursorPointer">
        <input type="radio" name="q+{{id}}" />
        جنس خوب
      </label>
    </div>

  </div>
  <div class="d-flex align-items-center gap-2 flex-column flex-lg-row justify-content-lg-between mb-2 pe-lg-4">
    <div class="d-flex align-items-center gap-2">
      <button  class="card-question-1 border-radius-10 px-3 py-2 color-10 font-family-bold font-14 ">
        <img src="assets/image/my-educational-system/i-exam-multiple-choice-svgrepo-com.svg" class="me-2">
        ویرایش
      </button>
      <button class="card-question-1 border-radius-10 px-3 py-2 color-10 font-family-bold font-14">
        <img src="assets/image/my-educational-system/i-exam-multiple-choice-svgrepo-com.svg" class="me-2">

        حذف

      </button>
    </div>
    <div>
      <app-progress-circle [text]="'سختی سوال'"/>
    </div>

  </div>
</div>
