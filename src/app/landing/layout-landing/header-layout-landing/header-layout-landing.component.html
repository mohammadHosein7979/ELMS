<div class="container py-12">
  <div class="d-flex justify-content-between gap-2 align-items-center">
    <div class="d-flex align-items-center gap-2 cursorPointer" routerLink="/">
      <img src="assets/image/logo.jpg" class="header-layout-landing-1 " >
      <div>
        <p class="font-family-bold color-1 font-12">
          یونیفای
        </p>
        <p class="font-family-regular color-1 font-12 header-layout-landing-2">
          دانشگاه مجازی رسانه
          و تولید محتوا
        </p>
      </div>


    </div>
    <div *ngIf="!flagMobile" class="d-flex gap-3">
      @for (item of headerLayoutLandingService.listMenu;track item){
      <p
        (click)="navigateAndScroll(item)"
        class="cursorPointer font-family-regular font-14 color-1 d-flex align-items-center gap-1">
        <img src="{{item?.image}}">
        {{item?.title}}
      </p>
      }

    </div>
    <div>
      @if (userService.getUser()) {
      <button routerLink="/panel"
        class="bg-color-13 border-color-13 border-radius-10 font-family-regular font-14 color-1 px-2 py-1">
        <img src="assets/image/landing/user-svgrepo-com.svg">
       حساب کاربری
      </button>
      }@else {
      <button routerLink="/auth/login"
        class="bg-color-13 border-color-13 border-radius-10 font-family-regular font-14 color-1 px-2 py-1">
        <img src="assets/image/landing/user-svgrepo-com.svg">
        ورود / عضویت
      </button>
      }

    </div>
  </div>
  <div class="mt-3"  *ngIf="flagMobile">
    <div class="d-flex gap-3 justify-content-between">
      @for (item of headerLayoutLandingService.listMenu;track item){
        <div
             (click)="navigateAndScroll(item)"

             class="cursorPointer font-family-regular  font-14 color-1 d-flex align-items-center gap-1 flex-column">
          <img src="{{item?.image}}">
          <p>
            {{item?.title}}

          </p>
        </div>
      }

    </div>

  </div>
</div>
